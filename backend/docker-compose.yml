name: coy-discover

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coy
      POSTGRES_PASSWORD: coy
      POSTGRES_DB: coy
    ports:
      - '5441:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coy -d coy']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
